[workspace]
resolver = "2"
members = [
    "crates/nx",
    "crates/nx-core",
    "crates/nx-nixos",
    "crates/nx-clean",
    "crates/nx-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nix-community/nx"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env", "color"] }
clap-verbosity-flag = "2"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }
indicatif = "0.17"
yansi = "1"
tempfile = "3"
walkdir = "2"
regex = "1"
